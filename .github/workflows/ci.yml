name: AEGISYNTH CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegisynth-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

      - name: Verify deterministic benchmark contract
        run: |
          python - <<'PY'
          from app.engine import AegisynthEngine
          r = AegisynthEngine(seed=42).run(generations=4)
          assert r.baseline_attack_success_rate == 0.5383
          assert r.final_attack_success_rate == 0.0743
          assert r.metrics.final_fraud_coverage == 0.9257
          assert r.metrics.benign_acceptance_rate == 0.9943
          assert r.final_policy.verified
          assert r.final_policy.action in {"STEP_UP", "REVIEW"}
          print("benchmark contract verified")
          PY

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build production dashboard
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
