name: AEGISYNTH CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegisynth-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Guard exact backend dependency declarations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          requirement = re.compile(r"^[A-Za-z0-9_.-]+(?:\[[A-Za-z0-9_,.-]+\])?==[^=<>!~\s]+$")
          violations = []
          for line_no, raw in enumerate(Path("requirements.txt").read_text().splitlines(), start=1):
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              if not requirement.fullmatch(line):
                  violations.append(f"line {line_no}: {line}")

          if violations:
              raise SystemExit(
                  "Backend dependency declarations must use exact == pins:\n" + "\n".join(violations)
              )
          print("backend direct dependency declarations are exact")
          PY

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Capture resolved Python environment
        run: python -m pip freeze --all > pip-freeze.txt

      - name: Preserve resolved backend dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-pip-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/pip-freeze.txt
          if-no-files-found: error
          retention-days: 14

      - name: Run test suite
        run: python -m pytest -q --durations=20 --junitxml=pytest-report.xml

      - name: Preserve backend test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-pytest-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: backend/pytest-report.xml
          if-no-files-found: error
          retention-days: 14

      - name: Verify deterministic benchmark contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from app.engine import AegisynthEngine

          expected = json.loads(Path("../submission/benchmark_seed42.json").read_text())
          r = AegisynthEngine(seed=expected["seed"]).run(generations=expected["generations"])

          assert r.seed == expected["seed"]
          assert r.attack_family == expected["attack_family"]
          assert r.baseline_attack_success_rate == expected["baseline_attack_success_rate"]
          assert r.final_attack_success_rate == expected["final_attack_success_rate"]
          assert r.metrics.final_fraud_coverage == expected["final_fraud_family_coverage"]
          assert r.metrics.final_false_positive_rate == expected["final_false_positive_rate"]
          assert r.metrics.benign_acceptance_rate == expected["benign_acceptance_rate"]
          assert r.final_policy.verified
          assert r.final_policy.action in {"STEP_UP", "REVIEW"}
          print("submitted benchmark artifact contract verified")
          PY

  frontend:
    name: Frontend production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Guard exact dependency declarations
        run: |
          node - <<'NODE'
          const pkg = require('./package.json');
          const groups = ['dependencies', 'devDependencies'];
          const exact = /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/;
          const violations = [];
          for (const group of groups) {
            for (const [name, version] of Object.entries(pkg[group] || {})) {
              if (!exact.test(version)) violations.push(`${group}.${name}=${version}`);
            }
          }
          if (violations.length) {
            throw new Error(`Frontend dependency versions must be exact: ${violations.join(', ')}`);
          }
          console.log('frontend direct dependency declarations are exact');
          NODE

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Capture resolved dependency graph
        run: npm ls --all --json > npm-dependency-tree.json

      - name: Preserve resolved dependency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dependency-tree-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/npm-dependency-tree.json
          if-no-files-found: error
          retention-days: 14

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build production dashboard
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
