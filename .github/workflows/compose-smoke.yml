name: AEGISYNTH Compose Smoke

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/compose-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/compose-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegisynth-compose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate compose configuration
        run: docker compose config --quiet

      - name: Build services
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for healthy services
        shell: bash
        run: |
          set -euo pipefail
          for service in api web; do
            cid="$(docker compose ps -q "$service")"
            test -n "$cid"
            for attempt in {1..30}; do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")"
              if [ "$status" = "healthy" ]; then
                break
              fi
              if [ "$status" = "unhealthy" ] || [ "$status" = "exited" ] || [ "$status" = "dead" ]; then
                docker compose logs "$service"
                exit 1
              fi
              sleep 2
            done
            final_status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$cid")"
            test "$final_status" = "healthy"
          done

      - name: Verify loopback-only host bindings
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(docker compose port api 8000)" == 127.0.0.1:* ]]
          [[ "$(docker compose port web 3000)" == 127.0.0.1:* ]]

      - name: Smoke-test HTTP surfaces
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8000/health >/dev/null
          # /ready intentionally replays the deterministic benchmark, validates the
          # governed review package, and exercises the real Z3 verifier. Keep this
          # fail-closed check in Compose CI, but give the bounded deep verification
          # enough time on a cold GitHub-hosted runner instead of treating 30s as a
          # liveness deadline.
          time curl --fail --silent --show-error --max-time 120 http://127.0.0.1:8000/ready >/dev/null
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/ >/dev/null

      - name: Verify services run unprivileged
        run: |
          test "$(docker compose exec -T api id -u)" -ne 0
          test "$(docker compose exec -T web id -u)" -ne 0

      - name: Show service state on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans